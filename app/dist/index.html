<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili Notes</title>
    <script type="module" crossorigin src="/assets/index-3df2cfa2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dn4-zp63.css">
    <style>
      /* 用图片 logo 替换顶栏与空状态里原来的内联 SVG 图标 */
      .brand-mark{background:url("/logo-128.png") center/contain no-repeat}
      .brand-mark>svg{display:none}
    </style>

  <body>
    <div id="root"></div>

    <!-- 「下载视频」面板：纯下载，不解析。逻辑见 app/dist 的这份内联脚本 -->
    <script>
/* 「下载视频」—— 点了就下，不弹窗。
 *
 * 目录取设置页里配置的 download_path（没配置就用系统的「下载」文件夹），
 * 进度显示在页面底部的一条状态条上，不打断当前操作。
 *
 * 前端是已构建的 React bundle，没有源码，所以这块用原生 DOM 写，
 * 复用应用自己的 CSS 变量和 .btn 类，跟原生界面一致。
 */
(function () {
  "use strict";

  var st = { es: null, taskId: null, running: false, hideTimer: null };

  function el(id) { return document.getElementById(id); }

  function getJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) { return r.json(); });
  }

  function postJSON(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
  }

  /* 设置页那颗输入框用：改完即存 */
  window.__dshSetDownloadDir = function (dir) {
    return fetch("/api/config", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ download_path: String(dir == null ? "" : dir) })
    }).then(function (r) { return r.json(); }).catch(function () { return null; });
  };

  /* ---------- 原生文件夹选择框（只在设置页用） ---------- */
  function pickDir(input) {
    if (!input) return Promise.resolve();
    return postJSON("/api/pick-directory", {
      initial: input.value || "",
      title: "选择下载目录"
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.path) {
          input.value = res.path;
          window.__dshSetDownloadDir(res.path);
        }
      })
      .catch(function () {});
  }

  /* ---------- 底部状态条 ---------- */
  function buildStrip() {
    var bar = document.createElement("div");
    bar.id = "ds-dl-strip";
    bar.style.cssText = [
      "position:fixed", "left:50%", "transform:translateX(-50%)", "bottom:18px",
      "z-index:300", "display:none", "align-items:center", "gap:10px",
      "min-width:460px", "max-width:min(760px,92vw)",
      "background:var(--bg-1)", "border:1px solid var(--line)", "border-radius:12px",
      "box-shadow:0 14px 36px rgba(0,0,0,.38)", "padding:11px 13px"
    ].join(";");
    bar.innerHTML = [
      '<div id="ds-dl-icon" style="font-size:15px;line-height:1;flex:0 0 auto">⏳</div>',
      '<div style="flex:1;min-width:0">',
      '  <div id="ds-dl-title" style="font-size:12px;color:var(--fg-1);font-weight:600;',
      '    white-space:nowrap;overflow:hidden;text-overflow:ellipsis">正在下载…</div>',
      '  <div style="height:4px;background:var(--bg-3);border-radius:3px;margin-top:6px;overflow:hidden">',
      '    <div id="ds-dl-fill" style="height:100%;width:0;background:var(--accent);',
      '      transition:width .25s ease"></div>',
      '  </div>',
      '  <div id="ds-dl-sub" style="font-size:10.5px;color:var(--fg-3);margin-top:5px;',
      '    white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>',
      '</div>',
      '<button id="ds-dl-act" class="btn btn-sm btn-outline"',
      '  style="white-space:nowrap;display:none">打开文件夹</button>',
      '<button id="ds-dl-cancel" class="btn btn-sm btn-outline"',
      '  style="white-space:nowrap;display:none">取消</button>',
      '<button id="ds-dl-x" class="btn btn-sm btn-ghost" title="关闭"',
      '  style="white-space:nowrap">✕</button>'
    ].join("");
    document.body.appendChild(bar);

    el("ds-dl-x").onclick = function () { hideStrip(); if (st.running) cancel(); };
    el("ds-dl-cancel").onclick = cancel;
    el("ds-dl-act").onclick = function () {
      var p = el("ds-dl-act").dataset.path;
      if (p) postJSON("/api/reveal", { path: p }).catch(function () {});
    };
    return bar;
  }

  function strip() { return el("ds-dl-strip") || buildStrip(); }

  function showStrip() {
    if (st.hideTimer) { clearTimeout(st.hideTimer); st.hideTimer = null; }
    var b = strip();
    b.style.display = "flex";
    return b;
  }

  function hideStrip() {
    var b = el("ds-dl-strip");
    if (b) b.style.display = "none";
  }

  function setIcon(txt, color) {
    var i = el("ds-dl-icon");
    if (i) { i.textContent = txt; i.style.color = color || "var(--fg-1)"; }
  }

  function setText(title, sub) {
    var t = el("ds-dl-title");
    if (t) t.textContent = title;
    if (sub !== undefined) {
      var s = el("ds-dl-sub");
      if (s) s.textContent = sub;
    }
  }

  function setFill(pct, color) {
    var f = el("ds-dl-fill");
    if (!f) return;
    f.style.width = Math.max(0, Math.min(100, pct)) + "%";
    f.style.background = color || "var(--accent)";
  }

  function setButtons(state) {
    var act = el("ds-dl-act"), cancel = el("ds-dl-cancel");
    if (act) act.style.display = state === "done" ? "" : "none";
    if (cancel) cancel.style.display = state === "running" ? "" : "none";
  }

  /* ---------- 进度流 ---------- */
  function stopStream() {
    if (st.es) { try { st.es.close(); } catch (e) {} st.es = null; }
  }

  function follow(taskId, targetDir) {
    stopStream();
    st.taskId = taskId;
    var es = new EventSource("/api/progress/" + taskId);
    st.es = es;

    es.onmessage = function (ev) {
      var data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      if (data.type === "progress") {
        var pct = data.progress || 0;
        setFill(pct);
        setText("正在下载 " + pct + "%", targetDir || "");
      } else if (data.type === "done") {
        finish(data.path, data.bytes, data.download_path || targetDir);
        stopStream();
      } else if (data.type === "error") {
        fail(data.message);
        stopStream();
      } else if (data.type === "closed") {
        stopStream();
        if (st.running) {          // 流断了但没收到结局
          fail("下载中断了，没有收到完成事件");
        }
      }
    };
    es.onerror = function () {
      stopStream();
      if (st.running) fail("与后端的进度连接中断了");
    };
  }

  function finish(path, bytes, dir) {
    st.running = false;
    st.taskId = null;
    setIcon("✓", "var(--ok)");
    setFill(100, "var(--ok)");
    setText("下载完成  " + fmtSize(bytes), path || dir || "");
    var act = el("ds-dl-act");
    if (act) act.dataset.path = path || dir || "";
    setButtons("done");
    if (st.hideTimer) clearTimeout(st.hideTimer);
    st.hideTimer = setTimeout(hideStrip, 15000);
  }

  function fail(message) {
    st.running = false;
    st.taskId = null;
    setIcon("!", "var(--err)");
    setFill(100, "var(--err)");
    setText(message || "下载失败", "");
    setButtons("error");
  }

  function cancel() {
    if (!st.taskId) { hideStrip(); return; }
    postJSON("/api/cancel/" + st.taskId, {}).catch(function () {});
    stopStream();
    st.running = false;
    st.taskId = null;
    setIcon("—", "var(--fg-2)");
    setFill(0);
    setText("已取消");
    setButtons("error");
  }

  function fmtSize(n) {
    n = Number(n) || 0;
    if (!n) return "";
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
    if (n >= 1024) return (n / 1024).toFixed(0) + " KB";
    return n + " B";
  }

  /* ---------- 主入口：点了就下 ---------- */
  function currentUrl() {
    var input = document.querySelector('input[placeholder*="粘贴"]');
    return input ? String(input.value || "").trim() : "";
  }

  function start() {
    if (st.running) {
      showStrip();
      setText("上一次下载还没结束", "等它完成，或者点右边的「取消」");
      return;
    }
    var url = currentUrl();
    showStrip();
    if (!url) {
      fail("请先在输入框里粘贴视频链接");
      return;
    }
    if (!/^https?:\/\//i.test(url)) {
      fail("只支持 http(s) 开头的视频链接");
      return;
    }

    st.running = true;
    setIcon("⏳");
    setFill(0);
    setText("正在提交…", "");
    setButtons("running");

    // 目录完全交给后端决定（配置里的 download_path，没配置就用系统「下载」）
    postJSON("/api/download", { url: url })
      .then(function (r) {
        return r.json().then(function (body) { return { ok: r.ok, body: body }; });
      })
      .then(function (res) {
        if (!res.ok) {
          fail((res.body && res.body.detail) || "提交失败");
          return;
        }
        var dir = res.body.download_path || "";
        setText("正在下载…", dir);
        follow(res.body.task_id, dir);
      })
      .catch(function (err) {
        fail("请求后端失败：" + err);
      });
  }

  /* ---------- 设置页那颗「视频下载目录」----------
   * 它是我们注入的、不属于 React 的 state，所以值从后端现取、原生事件存回，
   * 避免和 React 自己的保存流程打架。
   */
  function syncSettingsField() {
    var input = document.getElementById("ds-cfg-download-dir");
    if (!input) return;

    if (input.dataset.dsBound !== "1") {
      input.dataset.dsBound = "1";
      var persist = function () { window.__dshSetDownloadDir(input.value); };
      input.addEventListener("change", persist);
      input.addEventListener("focusout", persist);
    }

    if (!document.getElementById("ds-cfg-browse")) {
      var row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;align-items:center";
      input.parentNode.insertBefore(row, input);
      row.appendChild(input);
      input.style.flex = "1";
      var btn = document.createElement("button");
      btn.id = "ds-cfg-browse";
      btn.type = "button";
      btn.className = "btn btn-sm btn-outline";
      btn.textContent = "浏览…";
      btn.style.whiteSpace = "nowrap";
      btn.onclick = function () { pickDir(input); };
      row.appendChild(btn);
    }

    if (input.dataset.dsSynced === "1") return;
    input.dataset.dsSynced = "1";
    getJSON("/api/config").then(function (cfg) {
      if (document.activeElement !== input) {
        input.value = (cfg && cfg.download_path) || "";
      }
    }).catch(function () {});
  }

  function watchSettingsField() {
    if (!document.body) { setTimeout(watchSettingsField, 50); return; }
    syncSettingsField();
    new MutationObserver(syncSettingsField)
      .observe(document.body, { childList: true, subtree: true });
  }

  window.__dshDownloadUi = {
    start: start,
    open: start,        // 兼容旧引用
    cancel: cancel
  };

  watchSettingsField();
})();

    </script>
  </body>
</html>
